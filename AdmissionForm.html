
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .form-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #1f2937;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 500px) {
            .form-container {
                padding: 25px 20px;
            }

            .form-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>Student Admission Form</h1>
            <p>Please fill in the information below</p>
        </div>

        <form id="admissionForm">

            <!-- Student Name -->
            <div class="form-group">
                <label for="studentName">Student Name *</label>
                <input
                    type="text"
                    id="studentName"
                    name="student_name"
                    placeholder="Enter student name"
                    required
                >
            </div>

            <!-- Father Name -->
            <div class="form-group">
                <label for="fatherName">Father Name *</label>
                <input
                    type="text"
                    id="fatherName"
                    name="father_name"
                    placeholder="Enter father name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >
            </div>

            <!-- Contact Number -->
            <div class="form-group">
                <label for="contact">Contact Number *</label>
                <input
                    type="tel"
                    id="contact"
                    name="contact_no"
                    placeholder="Enter contact number"
                    required
                >
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Select Course *</label>

                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Digital Marketing">Digital Marketing</option>
                    <option value="AI & Automation">AI & Automation</option>
                    <option value="Graphic Designing">Graphic Designing</option>
                    <option value="Python Programming">Python Programming</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Submit -->
            <button type="submit" class="submit-btn" id="submitBtn">
                Submit Admission
            </button>

            <div id="message"></div>

        </form>
    </div>


    <script>

        // ============================================
        // PUT YOUR N8N WEBHOOK URL HERE
        // ============================================

        const webhookURL = "https://jawad3.app.n8n.cloud/webhook/14fe6232-85cb-46cf-8a9d-2e8c50dea1d0";


        // ============================================
        // FORM SUBMISSION
        // ============================================

        document.getElementById("admissionForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const message = document.getElementById("message");

            // Get form data
            const formData = {
                student_name: document.getElementById("studentName").value.trim(),
                father_name: document.getElementById("fatherName").value.trim(),
                email: document.getElementById("email").value.trim(),
                contact_no: document.getElementById("contact").value.trim(),
                course: document.getElementById("course").value
            };

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            message.textContent = "";
            message.className = "";

            try {

                const response = await fetch(webhookURL, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error("Failed to submit form");
                }

                // Success message
                message.textContent = "Admission form submitted successfully!";
                message.className = "success";

                // Reset form
                document.getElementById("admissionForm").reset();

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Something went wrong. Please try again.";

                message.className = "error";

            } finally {

                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Admission";

            }

        });

    </script>

</body>
</html>
